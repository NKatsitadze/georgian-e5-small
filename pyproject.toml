[project]
name = "georgian-embeddings"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nika", email = "nikakatsitadze98@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mteb>=2.27.18",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
georgian-embeddings = "georgian_embeddings:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "kaggle>=2.2.5",
    "six>=1.17.0",
]
